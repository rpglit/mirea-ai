[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petrinet"
version = "0.1.0"
description = "Petri net analysis web app: parser, reachability, properties, API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sympy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "types-jsonschema>=4.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
petrinet = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["petrinet"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "petrinet.solvers.links"
disable_error_code = ["no-untyped-call", "import-untyped", "call-overload"]
